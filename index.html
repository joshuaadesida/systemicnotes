<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SystemicNotes is Joshua Adesida's publication for writing and research.">
  <meta name="author" content="Joshua Adesida">
  <link rel="canonical" href="https://joshuaadesida.github.io/systemicnotes/">
  <title>SystemicNotes by Joshua Adesida</title>
  <script>
    // Forward links created when the tracker lived at the publication root.
    const trackerKeys = ["nation", "compare", "layer", "active", "basemap"];
    const trackerSections = ["#explore", "#evidence", "#brief", "#methods", "#compare", "#community-profile"];
    const params = new URLSearchParams(location.search);
    if (trackerSections.includes(location.hash) || trackerKeys.some((key) => params.has(key))) {
      const target = new URL("./first-nations-infrastructure-tracker/", location.href);
      for (const key of trackerKeys.slice(0, -1)) {
        if (params.has(key)) target.searchParams.set(key, params.get(key));
      }
      if (trackerSections.includes(location.hash)) target.hash = location.hash;
      location.replace(target);
    }
  </script>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #142b3d; background: #f3f7f6; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.55; }
    .wrap { width: min(66rem, calc(100% - 2.75rem)); margin-inline: auto; }
    .masthead { background: #0e2738; color: #d2e6e4; }
    .masthead .wrap { min-height: 62px; display: flex; align-items: center; gap: .85rem; }
    .brand { color: #fff; font-size: 1.08rem; font-weight: 770; }
    .author { padding-left: .85rem; border-left: 1px solid #607e87; font-size: .88rem; }
    .hero { padding-block: clamp(2.1rem, 6vw, 4rem); background: #e7f0ed; border-bottom: 1px solid #d1e1dc; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { line-height: 1.15; letter-spacing: -.04em; }
    h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); }
    p { color: #385565; }
    .hero p { margin-top: .55rem; font-size: 1.09rem; }
    .projects { padding-block: 2rem 3rem; }
    h2 { font-size: 1.6rem; margin-bottom: .7rem; }
    .project { display: block; padding: clamp(1rem, 3vw, 1.45rem); color: #142b3d; background: #fff; border: 1px solid #cbdad8; border-radius: 10px; text-decoration: none; max-width: 48rem; }
    .project h3 { font-size: clamp(1.25rem, 3vw, 1.75rem); }
    .project p { margin-top: .5rem; }
    .project:hover { border-color: #08685f; background: #f8fdfb; }
    .project:hover h3 { text-decoration: underline; text-underline-offset: .2em; }
    .project:focus-visible { outline: 3px solid #08685f; outline-offset: 4px; }
  </style>
</head>
<body>
  <header class="masthead"><div class="wrap"><span class="brand">SystemicNotes</span><span class="author">Joshua Adesida</span></div></header>
  <main>
    <div class="hero"><div class="wrap"><h1>SystemicNotes</h1><p>Writing and research by Joshua Adesida.</p></div></div>
    <section class="wrap projects" aria-labelledby="projects">
      <h2 id="projects">Projects</h2>
      <a href="./first-nations-infrastructure-tracker/" class="project">
        <h3>First Nations Infrastructure, Water &amp; Capital Gap Tracker</h3>
        <p>Explore public records on drinking water, winter roads, housing and infrastructure investment across Manitoba First Nations.</p>
      </a>
    </section>
  </main>
</body>
</html>
